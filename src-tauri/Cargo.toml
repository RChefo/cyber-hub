[package]
name = "cyber-hub"
version = "0.1.0"
description = "Cyber Hub — local-first cybersecurity workstation"
authors = ["Cyber Hub contributors"]
edition = "2021"
rust-version = "1.90"
default-run = "cyber-hub"

[lib]
name = "cyber_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Builds the developer-only credential provisioning tool `cyberhub-keys`. Never enable this for
# application builds or installers (see docs/PROVISIONING.md).
provisioning = ["dep:rpassword"]
# Exposes parser entry points to the cargo-fuzz targets in fuzz/. Never enable this for application
# builds or installers.
fuzzing = []

[[bin]]
name = "cyber-hub"
path = "src/main.rs"

[[bin]]
name = "cyberhub-mcp"
path = "src/bin/cyberhub-mcp.rs"

[[bin]]
name = "cyberhub-keys"
path = "src/bin/cyberhub-keys.rs"
required-features = ["provisioning"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.3.4"
# decoding imported files saved as UTF-16 or Windows-1252 (already in the dependency tree)
encoding_rs = "0.8"
hickory-resolver = "0.26"
hmac = "0.12.1"
ipnet = "2.12.2"
keyring = { version = "3.6.3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
# wipes a credential typed into the native dialog (already in the tree through keyring and rustls)
zeroize = "1.9"
md-5 = "0.10.6"
once_cell = "1.21.4"
# GraphML import for the OSINT workspace (no DTD or external entity processing)
quick-xml = "0.42"
# dependency lockfiles (Cargo, Poetry, uv); the version tauri-build already uses
toml = "1"
# Terraform configuration (HCL) for the cloud infrastructure-as-code checks
hcl-rs = "0.20"
# YARA rules (pure Rust, no JIT): no process scanning, memory maps or signature verification
boreal = { version = "1.4.0", default-features = false, features = ["hash", "object", "authenticode"] }
# PE and ELF headers for the static file triage (no Mach-O, archives or TE)
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "pe32", "pe64", "endian_fd"] }
regex = "1.13.1"
# developer-only provisioning tool (feature "provisioning"); not part of app builds
rpassword = { version = "7.5.4", optional = true }
# official Model Context Protocol SDK (stdio server in the `cyberhub-mcp` binary)
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "charset", "http2", "multipart", "stream", "query", "form"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
sysinfo = "0.36.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# one running instance: a second launch would otherwise clear the first one's run snapshots and
# MCP connection files at startup
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["process", "io-util", "time", "sync", "macros", "rt", "fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
which = "8.0.6"
# official signed updater (minisign signatures, HTTPS feed); driven only from the backend
tauri-plugin-updater = "2.14.1"
x509-parser = "0.18"
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
yaml-rust2 = { version = "0.13", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security_Credentials", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# the native credential dialog on Linux (the same GTK 3 bindings Tauri uses)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# whether a credential exists, without unlocking the keyring (the Secret Service client keyring uses)
dbus-secret-service = "4.1.0"

[dev-dependencies]
# test oracle only (Markdown report escaping is checked against a real CommonMark parser)
pulldown-cmark = { version = "=0.13.6", default-features = false }
# test only: a throwaway self-signed certificate for the TLS refusal test (already in the tree through rustls)
ring = "0.17"
