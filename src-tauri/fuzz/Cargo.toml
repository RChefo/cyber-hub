[package]
name = "cyber-hub-fuzz"
version = "0.0.0"
publish = false
license = "Apache-2.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cyber-hub = { path = "..", features = ["fuzzing"] }

# not part of the application's build
[workspace]
members = ["."]

[[bin]]
name = "yaml"
path = "fuzz_targets/yaml.rs"
test = false
doc = false
bench = false

