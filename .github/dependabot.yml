# Dependency updates (Mission 12). Security updates are turned on in the repository settings and do
# not depend on this file; these are the regular version updates. Updates are grouped to keep the
# number of pull requests small, and their titles follow Conventional Commits, as CI requires.
# Every update runs the full CI, including the license policy check, before it can be merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      # the RustCrypto hashes share the `digest` traits: a new digest line only compiles when they
      # move together (Mission 14: sha1, sha2 and hmac alone failed against digest 0.11)
      rustcrypto:
        patterns: [digest, sha1, sha2, md-5, hmac]
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # actions stay pinned to full commit SHAs; Dependabot updates the SHA and its version comment
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
