name: CI

# Verification only: typecheck, tests and a frontend build on Windows, macOS and Linux.
# Installer packaging (MSI / NSIS / DMG / AppImage) is intentionally NOT part of CI;
# release builds are produced manually after sign-off.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies (Tauri + Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies (runs the freezePrototype compatibility patch + self-test)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Frontend tests
        run: npx vitest run

      - name: Frontend production build
        run: npx vite build

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: npm audit
        run: npm audit --audit-level=high
