name: Release

# Builds, signs and publishes an ExploitX release together with its update manifest (latest.json).
#
# - Runs only for a pushed version tag (vMAJOR.MINOR.PATCH) or a manual run naming an existing tag;
#   never for pull requests, so untrusted code never sees the signing secrets.
# - A release candidate's tag is vMAJOR.MINOR.PATCH-rc.N on the same version files (Mission 11). It is
#   built and checked like the release, its draft is a GitHub pre-release (never the "latest" release
#   that the update feed points to), and this workflow never makes it public.
# - validate: version, tag and branch checks, tests, clippy and security checks (no secrets).
# - build and publish run only in a manual run (Actions → Release → Run workflow) and only while the
#   repository variable RELEASE_PUBLISHING is `enabled` (Settings → Secrets and variables → Actions →
#   Variables). A tag push only validates, also while publishing is enabled: nothing is signed or
#   uploaded without someone starting the run by hand (Mission 7).
# - build: the only job that receives TAURI_SIGNING_PRIVATE_KEY and its password, in the protected
#   `release` environment (add required reviewers under Settings → Environments → release).
# - publish: generates latest.json, verifies every signature against the public key compiled into
#   the app, checks that the tag still names the commit that was validated and built (Mission 8),
#   and uploads everything to a draft release. A run stops at the draft unless "draft" is unchecked
#   and the tag is typed again in "confirm"; the tag is checked again before the release becomes
#   public. A failure in any job leaves nothing published.
# Toolchains and tools are exact versions (the same as ci.yml); src-tauri/src/ci_tests.rs fails if
# an action, toolchain or tool floats or a gate disappears. No caches are used here (a poisoned
# cache must not reach a signed build). See docs/UPDATER.md for the setup and the owner's checklist.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0 (or a release candidate, v0.2.0-rc.1)"
        required: true
        type: string
      draft:
        description: "Stop at a draft release (publish it by hand after review)"
        required: true
        type: boolean
        default: true
      confirm:
        description: "To publish publicly (draft unchecked), type the tag again"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "22.12.0"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version, tag and branch
        id: version
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH or a release candidate vMAJOR.MINOR.PATCH-rc.N (the stable channel has no other pre-releases)"; exit 1
          fi
          # a release candidate builds the version it is a candidate for: the files carry no suffix
          version="${BASH_REMATCH[1]}"
          candidate="${BASH_REMATCH[6]}"
          for f in package.json src-tauri/tauri.conf.json; do
            v=$(jq -r .version "$f")
            [ "$v" = "$version" ] || { echo "::error::$f has version $v but the tag is $TAG"; exit 1; }
          done
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$v" = "$version" ] || { echo "::error::src-tauri/Cargo.toml has version $v but the tag is $TAG"; exit 1; }
          sha=$(git rev-parse HEAD)
          if ! git branch -r --contains "$sha" | grep -Eq '^\s*origin/(main|release/[^ ]+)$'; then
            echo "::error::$sha is not on main or a release/* branch"; exit 1
          fi
          {
            echo "version=$version"
            echo "candidate=$candidate"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Updater configuration
        run: |
          set -euo pipefail
          c=src-tauri/tauri.conf.json
          jq -e '(.plugins.updater.pubkey | length) > 100' "$c" > /dev/null || { echo "::error::plugins.updater.pubkey is missing"; exit 1; }
          jq -e '.plugins.updater.requireSignedVersion == true' "$c" > /dev/null || { echo "::error::requireSignedVersion must stay enabled"; exit 1; }
          jq -e '.bundle.createUpdaterArtifacts == true' "$c" > /dev/null || { echo "::error::bundle.createUpdaterArtifacts must be true"; exit 1; }
          if jq -e '.plugins.updater | (.dangerousInsecureTransportProtocol // false) or (.dangerousAcceptInvalidCerts // false) or (.dangerousAcceptInvalidHostnames // false)' "$c" > /dev/null; then
            echo "::error::insecure updater options are set"; exit 1
          fi

      - name: No private key in the repository
        run: |
          set -euo pipefail
          # base64 of "untrusted comment: rsign encrypted secret key" (the private key file header)
          if git grep -l -e 'dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5' -e 'rsign encrypted secret key' -- . ':!.github/workflows/release.yml'; then
            echo "::error::a private signing key is committed"; exit 1
          fi

      - name: Release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          version="${version%-rc.*}"
          if [ -s "docs/releases/$version.md" ]; then cp "docs/releases/$version.md" notes.md
          else git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN/,$d' > notes.md; fi
          [ -s notes.md ] || { echo "::error::No release notes: add docs/releases/$version.md or annotate the tag"; exit 1; }

      - name: No release exists yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists"; exit 1
          fi

      - name: Release switch
        env:
          PUBLISHING: ${{ vars.RELEASE_PUBLISHING }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$PUBLISHING" = "enabled" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "RELEASE_PUBLISHING is enabled and this is a manual run: build and publish follow if validation passes."
            else
              echo "::notice::A tag push only validates: start the workflow by hand to build, sign and upload."
            fi
          else
            echo "::notice::RELEASE_PUBLISHING is not 'enabled': this run only validates; nothing is built, signed or uploaded."
          fi

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config build-essential

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend and release-script tests
        run: npx vitest run
      - name: Frontend production build
        run: npx vite build
      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: npm audit
        run: npm audit --audit-level=high
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit

  build:
    name: Build and sign (${{ matrix.name }})
    needs: validate
    # explicit opt-in: nothing is built or signed unless the owner enabled publishing and started
    # the run by hand (a tag push only validates)
    if: vars.RELEASE_PUBLISHING == 'enabled' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            bundles: nsis,msi
          - name: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf rpm file pkg-config build-essential

      - name: Licenses and corresponding source of the AppImage's libraries
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # Mission 14: the AppImage bundles LGPL and GPL libraries of this system (GTK, WebKitGTK and
          # their dependencies). Their copyright files go into the AppImage, their Debian source
          # packages next to it on the release (docs/governance/DISTRIBUTION_LICENSE_COMPLIANCE.md).
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          {
            echo "deb-src http://archive.ubuntu.com/ubuntu $codename main restricted universe multiverse"
            echo "deb-src http://archive.ubuntu.com/ubuntu $codename-updates main restricted universe multiverse"
            echo "deb-src http://security.ubuntu.com/ubuntu $codename-security main restricted universe multiverse"
          } | sudo tee /etc/apt/sources.list.d/exploitx-deb-src.list
          sudo apt-get update
          mkdir -p release-sources
          bash scripts/appimage-licenses.sh "$RUNNER_TEMP/appimage-licenses" \
            --sources "release-sources/ExploitX-AppImage-library-sources_${VERSION}.tar" \
            --tauri-config "$RUNNER_TEMP/appimage-files.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: npm ci

      - name: Build and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"; exit 1
          fi
          # the update feed of this repository is compiled into the release build only
          printf '{"plugins":{"updater":{"endpoints":["%s"]}}}' "$FEED" > "$RUNNER_TEMP/feed.json"
          config=(--config "$RUNNER_TEMP/feed.json")
          # the AppImage carries its libraries' copyright files (from the step above)
          if [ "$RUNNER_OS" = Linux ]; then config+=(--config "$RUNNER_TEMP/appimage-files.json"); fi
          npx tauri build --ci --bundles "$BUNDLES" "${config[@]}"

      - name: Collect signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find src-tauri/target/release/bundle -mindepth 2 -maxdepth 2 -type f \
            \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) \
            -exec cp {} release-assets/ \;
          for f in release-assets/*; do
            case "$f" in *.sig) ;; *) [ -s "$f.sig" ] || { echo "::error::$f was not signed"; exit 1; } ;; esac
          done
          # the source of the AppImage's libraries: not an update artifact, so not signed;
          # SHA256SUMS.txt covers it like every other asset
          if [ -d release-sources ]; then cp release-sources/* release-assets/; fi
          ls -l release-assets

      - name: Every package carries the third-party notices
        shell: bash
        run: node scripts/check-package-notices.mjs release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error
          # Mission 12: in a public repository any signed-in user can download a run's artifacts.
          # The publish job deletes them once the draft holds the files; one day bounds a failed run.
          retention-days: 1

  publish:
    name: Publish
    needs: [validate, build]
    if: vars.RELEASE_PUBLISHING == 'enabled' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      # only to delete this run's build artifacts after the upload (Mission 12)
      actions: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      CANDIDATE: ${{ needs.validate.outputs.candidate }}
      SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets

      - name: Release notes
        run: |
          set -euo pipefail
          if [ -s "docs/releases/$VERSION.md" ]; then cp "docs/releases/$VERSION.md" notes.md
          else git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN/,$d' > notes.md; fi
          [ -s notes.md ]

      - name: Generate and validate latest.json
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          node scripts/updater-manifest.mjs generate --normalize-names --version "$VERSION" --assets assets \
            --base-url "$base" --notes-file notes.md --out latest.json
          node scripts/updater-manifest.mjs validate --manifest latest.json --assets assets --base-url "$base" \
            --require windows-x86_64-nsis,windows-x86_64-msi,linux-x86_64-appimage,linux-x86_64-deb,linux-x86_64-rpm
          mv latest.json assets/latest.json
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: The tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag moved during the run (re-tagged by mistake, or by someone else) would put the
          # release on another commit than the binaries were built from (Mission 8).
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          obj=${ref#* }
          if [ "${ref%% *}" = "tag" ]; then obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq '.object.sha'); fi
          if [ "$obj" != "$SHA" ]; then
            echo "::error::$TAG now names $obj, not the validated and built $SHA; nothing is uploaded"; exit 1
          fi
          echo "$TAG names $SHA."

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE" ]; then
            # a release candidate is a pre-release: never the "latest" release the update feed names
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
              --title "ExploitX $VERSION, release candidate $CANDIDATE" --notes-file notes.md assets/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "ExploitX $VERSION" --notes-file notes.md assets/*
          fi
          expected=$(find assets -maxdepth 1 -type f -printf '%f\n' | sort)
          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::The draft release is missing assets; it stays a draft"; diff <(echo "$expected") <(echo "$actual") || true; exit 1
          fi

      - name: Check GitHub's asset digests against SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The website shows GitHub's per-asset SHA-256 digest as the file's checksum; it must be
          # the value in the published SHA256SUMS.txt for every file, or the release stays a draft.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '.[] | select(.tag_name == env.TAG) | .assets[] | [.name, (.digest // "")] | @tsv' > digests.tsv
          while read -r sum name; do
            got=$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' digests.tsv)
            if [ "$got" != "sha256:$sum" ]; then
              echo "::error::GitHub digest for $name is '${got:-missing}', expected sha256:$sum; the release stays a draft"; exit 1
            fi
          done < assets/SHA256SUMS.txt
          echo "Every asset digest matches SHA256SUMS.txt."

      - name: Delete this run's build artifacts (the draft holds the files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # In a public repository a workflow artifact can be downloaded by any signed-in GitHub user,
          # which would make the draft's binaries public (Mission 12). Only this run's bundles-* go.
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("bundles-")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted artifact $id"
          done
          left=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("bundles-"))] | length')
          [ "$left" = 0 ] || { echo "::error::$left build artifacts are still attached to this run"; exit 1; }

      - name: Publish the release
        # a run stops at the draft unless draft is unchecked and the tag is typed again
        if: github.event_name == 'workflow_dispatch' && inputs.draft == false && inputs.confirm == inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE" ]; then
            echo "::error::$TAG is a release candidate: it stays a draft (release the version under its own tag)"; exit 1
          fi
          # the tag is checked again just before the release becomes public (Mission 8)
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          obj=${ref#* }
          if [ "${ref%% *}" = "tag" ]; then obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq '.object.sha'); fi
          if [ "$obj" != "$SHA" ]; then
            echo "::error::$TAG now names $obj, not the built $SHA; the release stays a draft"; exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
