name: Question
description: Ask how something works when the documentation does not answer it.
title: "question: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please check the README and docs/ first. **Security vulnerabilities must not be reported here** (see SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you are trying to do, your version, operating system and installation format, and what you already read or tried.
